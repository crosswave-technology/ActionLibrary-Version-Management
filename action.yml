name: Version Management
description: 'Promote version based on PR labels or commit messages (updates VERSION file(s))'

inputs:
  pr_number:
    description: 'Pull Request Number'
    required: false
  version_file:
    description: 'Preferred VERSION file path (falls back to discovery if missing)'
    required: false
  push_changes:
    description: 'Push commit to remote (default true)'
    required: false
    default: 'true'

outputs:
  promotion_type:
    description: 'Resolved promotion type: major, minor or patch.'
    value: ${{ steps.promotion_type.outputs.promotion_type }}
  promotion_source:
    description: 'Where the promotion type was resolved from: pr_label, pr_title or commit_message.'
    value: ${{ steps.promotion_type.outputs.promotion_source }}
  promotion_reason:
    description: 'Human-readable reason for the promotion type (which marker decided it).'
    value: ${{ steps.promotion_type.outputs.promotion_reason }}
  version_files:
    description: 'Newline-separated list of VERSION files that were promoted.'
    value: ${{ steps.promote.outputs.version_files }}
  previous_version:
    description: 'Version before the bump. Set only when exactly one VERSION file was promoted.'
    value: ${{ steps.promote.outputs.previous_version }}
  new_version:
    description: 'Version after the bump. Set only when exactly one VERSION file was promoted.'
    value: ${{ steps.promote.outputs.new_version }}
  changes:
    description: 'Newline-separated "<file>: <old> -> <new>" line per promoted VERSION file.'
    value: ${{ steps.promote.outputs.changes }}
  committed:
    description: 'true when a commit was created, false when there was nothing to commit.'
    value: ${{ steps.promote.outputs.committed }}
  pushed:
    description: 'true when the commit was pushed, false when push_changes=false or nothing was committed.'
    value: ${{ steps.promote.outputs.pushed }}

runs:
  using: "composite"
  steps:
    - name: Ensure GitHub CLI is authenticated
      shell: bash
      run: |
        set -e
        if [ -z "${GH_TOKEN:-}" ] && [ -n "${GITHUB_TOKEN:-}" ]; then
          export GH_TOKEN="$GITHUB_TOKEN"
        fi
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "Missing GH_TOKEN/GITHUB_TOKEN for GitHub CLI."
          exit 1
        fi
        gh auth status || gh auth login --with-token <<< "$GH_TOKEN"

    - name: Determine Promotion Type
      id: promotion_type
      shell: bash
      # Event data and inputs are passed through env: and never interpolated into
      # the script body. This job runs with a GitHub App installation token in
      # scope, so a crafted commit message must not be able to reach the shell.
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        set -euo pipefail
        echo "Determine version promotion type ..."

        promotion_type=""
        promotion_source=""
        promotion_reason=""

        # Precedence is fixed: major beats minor beats patch, everywhere.
        rank_of() {
          case "$1" in
            major) printf '3' ;;
            minor) printf '2' ;;
            patch) printf '1' ;;
            *) printf '0' ;;
          esac
        }

        if [ -n "${PR_NUMBER:-}" ]; then
          # EXACT, case-insensitive whole-label match. This is deliberately the
          # same rule as the semver gate in pre-check_require-semver-label.yml
          # ("REQUIRED_LABELS.includes(l.toLowerCase())"), so the gate and the
          # bump can no longer disagree. Labels are read one per line, never
          # word-split: "enhancement-major-x" and "Major refactor" are NOT
          # version labels and must not promote.
          labels=()
          mapfile -t labels < <(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')

          matched=()
          if [ "${#labels[@]}" -gt 0 ]; then
            for label in "${labels[@]}"; do
              [ -n "$label" ] || continue
              label_lower=$(printf '%s' "$label" | tr '[:upper:]' '[:lower:]')
              case "$label_lower" in
                major|minor|patch) matched+=("$label_lower") ;;
              esac
            done
          fi

          if [ "${#matched[@]}" -gt 0 ]; then
            distinct=()
            mapfile -t distinct < <(printf '%s\n' "${matched[@]}" | sort -u)
            if [ "${#distinct[@]}" -gt 1 ]; then
              # The semver gate fails a PR carrying more than one version label,
              # so this should be unreachable; if labels changed after the gate
              # ran, promote deterministically on the highest precedence.
              echo "::warning title=Multiple version labels::PR #${PR_NUMBER} carries several version labels (${distinct[*]}); promoting on the highest precedence."
            fi
            best_rank=0
            for candidate in "${matched[@]}"; do
              candidate_rank=$(rank_of "$candidate")
              if [ "$candidate_rank" -gt "$best_rank" ]; then
                best_rank="$candidate_rank"
                promotion_type="$candidate"
              fi
            done
            if [ -n "$promotion_type" ]; then
              promotion_source="pr_label"
              promotion_reason="PR #${PR_NUMBER} label '${promotion_type}'"
            fi
          fi

          if [ -z "$promotion_type" ]; then
            title=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
            title_lower=$(printf '%s' "$title" | tr '[:upper:]' '[:lower:]')
            # Ordered highest-precedence-first with a break, so a title carrying
            # several markers promotes on the highest one rather than the last.
            for candidate in major minor patch; do
              if [[ "$title_lower" =~ (^|[^a-z])${candidate}([^a-z]|$) ]]; then
                promotion_type="$candidate"
                promotion_source="pr_title"
                promotion_reason="PR #${PR_NUMBER} title marker '${candidate}'"
                break
              fi
            done
          fi
        fi

        if [ -z "$promotion_type" ]; then
          msg_lower=$(printf '%s' "${HEAD_COMMIT_MESSAGE:-}" | tr '[:upper:]' '[:lower:]')
          for candidate in major minor patch; do
            if [[ "$msg_lower" =~ (^|[^a-z])${candidate}([^a-z]|$) ]]; then
              promotion_type="$candidate"
              promotion_source="commit_message"
              promotion_reason="Head commit message marker '${candidate}'"
              break
            fi
          done
        fi

        if [ -z "$promotion_type" ]; then
          echo "No valid promotion type found (Major, Minor, Patch)"
          exit 1
        fi

        # Single-line by construction; strip newlines defensively before the
        # value reaches $GITHUB_OUTPUT.
        promotion_reason=$(printf '%s' "$promotion_reason" | tr -d '\r\n')

        echo "Promotion type: $promotion_type (source: $promotion_source; $promotion_reason)"
        {
          echo "promotion_type=$promotion_type"
          echo "promotion_source=$promotion_source"
          echo "promotion_reason=$promotion_reason"
        } >> "$GITHUB_OUTPUT"
        # Retained for backwards compatibility with consumers that read the
        # environment variable rather than the step output.
        echo "promotion_type=$promotion_type" >> "$GITHUB_ENV"

    - name: Promote VERSION file(s)
      id: promote
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        VERSION_FILE: ${{ inputs.version_file }}
        PUSH_CHANGES: ${{ inputs.push_changes }}
        PROMOTION_TYPE: ${{ steps.promotion_type.outputs.promotion_type }}
      run: |
        set -euo pipefail
        promotion_type="${PROMOTION_TYPE:-${promotion_type:-}}"
        if [ -z "$promotion_type" ]; then
          echo "Promotion type not set."
          exit 1
        fi

        preferred_version_file="${VERSION_FILE:-}"
        version_files=()
        change_lines=()
        change_summaries=()
        previous_version=""
        new_version=""
        committed="false"
        pushed="false"

        emit_outputs() {
          {
            echo "version_files<<NEXUS_EOF"
            if [ "${#version_files[@]}" -gt 0 ]; then
              printf '%s\n' "${version_files[@]}"
            fi
            echo "NEXUS_EOF"
            echo "changes<<NEXUS_EOF"
            if [ "${#change_lines[@]}" -gt 0 ]; then
              printf '%s\n' "${change_lines[@]}"
            fi
            echo "NEXUS_EOF"
            echo "previous_version=$previous_version"
            echo "new_version=$new_version"
            echo "committed=$committed"
            echo "pushed=$pushed"
          } >> "$GITHUB_OUTPUT"
        }

        if [ -n "$preferred_version_file" ]; then
          if [ -f "$preferred_version_file" ]; then
            version_files+=("$preferred_version_file")
          else
            echo "Preferred version file '$preferred_version_file' not found; falling back to discovery."
          fi
        fi

        if [ "${#version_files[@]}" -eq 0 ]; then
          if [ -f "VERSION" ]; then
            version_files=("VERSION")
          elif [ -n "${PR_NUMBER:-}" ]; then
            echo "Discovering VERSION files from PR #${PR_NUMBER} changes..."
            mapfile -t changed_files < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
            for file in "${changed_files[@]}"; do
              [ -z "$file" ] && continue
              dir=$(dirname "$file")
              while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
                if [ -f "$dir/VERSION" ]; then
                  version_files+=("$dir/VERSION")
                fi
                dir=$(dirname "$dir")
              done
            done
          else
            echo "No VERSION file at repo root and no pr_number provided."
            exit 1
          fi
        fi

        if [ "${#version_files[@]}" -eq 0 ]; then
          echo "No VERSION files found."
          exit 1
        fi

        mapfile -t version_files < <(printf '%s\n' "${version_files[@]}" | awk 'NF' | sort -u)

        echo "VERSION files to update:"
        printf ' - %s\n' "${version_files[@]}"

        for version_file in "${version_files[@]}"; do
          current_version=$(tr -d '[:space:]' < "$version_file")
          version_prefix=""
          stripped_version="$current_version"
          case "$stripped_version" in
            v*|V*)
              version_prefix="${stripped_version:0:1}"
              stripped_version="${stripped_version:1}"
              ;;
          esac
          # Deliberately strict: arithmetic promotion is only defined for a plain
          # X.Y.Z base. A pre-release VERSION (e.g. v1.6.0-alpha.1) is rejected
          # rather than guessed at; pre-release tags are minted by the release
          # workflow, not by promoting a pre-release VERSION file.
          if ! [[ "$stripped_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format in $version_file: $current_version"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$stripped_version"
          if [ "$promotion_type" = "major" ]; then
            major=$((major + 1))
            minor=0
            patch=0
          elif [ "$promotion_type" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          bumped_version="${major}.${minor}.${patch}"
          if [ -n "$version_prefix" ]; then
            bumped_version="${version_prefix}${bumped_version}"
          fi
          echo "$bumped_version" > "$version_file"
          echo "Updated $version_file: $current_version -> $bumped_version"
          change_lines+=("$version_file: $current_version -> $bumped_version")
          change_summaries+=("$current_version -> $bumped_version")
          if [ "${#version_files[@]}" -eq 1 ]; then
            previous_version="$current_version"
            new_version="$bumped_version"
          fi
        done

        if git diff --quiet; then
          echo "No VERSION changes to commit."
          emit_outputs
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "${version_files[@]}"
        commit_title="ci: promote version"
        if [ "${#change_summaries[@]}" -eq 1 ]; then
          commit_title="ci: promote version (${change_summaries[0]})"
        elif [ "${#change_summaries[@]}" -gt 1 ]; then
          commit_title="ci: promote version (${#change_summaries[@]} files)"
        fi

        commit_args=(-m "$commit_title")
        if [ "${#change_lines[@]}" -gt 0 ]; then
          commit_args+=(-m "Updates:")
          for line in "${change_lines[@]}"; do
            commit_args+=(-m "- $line")
          done
        fi

        git commit "${commit_args[@]}"
        committed="true"

        push_changes_lower=$(printf '%s' "${PUSH_CHANGES:-}" | tr '[:upper:]' '[:lower:]')
        if [ "$push_changes_lower" = "false" ]; then
          echo "Skipping push (push_changes=false)."
          emit_outputs
          exit 0
        fi

        git push
        pushed="true"
        emit_outputs
